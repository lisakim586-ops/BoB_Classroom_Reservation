<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BoB 15기 강의실 예약</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EEF0F2;
    --panel: #F7F8FA;
    --ink: #1B2733;
    --ink-soft: #5C6A78;
    --line: #D6DBE1;
    --teal: #0069AD;
    --teal-tint: #E3F0F8;
    --copper: #A85A2C;
    --copper-tint: #F3E5D8;
    --slate: #46607D;
    --slate-tint: #E4EAF0;
    --taken: #E3E7EC;
    --danger: #B23A2F;
    --danger-tint: #F6E4E1;
    --radius: 3px;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
    --sans: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    padding:32px 20px 80px;
  }
  .wrap{max-width:920px;margin:0 auto;}

  /* header — like a physical door plaque strip */
  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    border-bottom:2px solid var(--teal);
    padding-bottom:18px;
    margin-bottom:28px;
    flex-wrap:wrap;
    gap:12px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .bob-badge{
    width:60px;
    height:60px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .bob-badge img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }
  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.14em;
    color:var(--ink-soft);
    text-transform:uppercase;
    margin:0 0 6px;
  }
  h1{
    margin:0;
    font-size:26px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .rooms-legend{
    display:flex;
    gap:10px;
    font-family:var(--mono);
    font-size:12px;
  }
  .tag{
    padding:5px 10px;
    border-radius:2px;
    font-weight:700;
    letter-spacing:0.04em;
  }
  .tag.e{background:var(--teal-tint);color:var(--teal);}
  .tag.d{background:var(--slate-tint);color:var(--slate);}

  /* date control */
  .datebar{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .datebar label{
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink-soft);
    letter-spacing:0.06em;
  }
  input[type=date]{
    font-family:var(--mono);
    font-size:14px;
    padding:8px 10px;
    border:1.5px solid var(--ink);
    border-radius:var(--radius);
    background:var(--panel);
    color:var(--ink);
  }
  .nav-btn{
    font-family:var(--mono);
    font-size:13px;
    border:1.5px solid var(--line);
    background:var(--panel);
    color:var(--ink);
    padding:7px 12px;
    border-radius:var(--radius);
    cursor:pointer;
  }
  .nav-btn:hover{border-color:var(--ink);}
  .today-label{
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink-soft);
  }

  /* board */
  .board{
    border:1.5px solid var(--ink);
    background:var(--panel);
    border-radius:var(--radius);
    overflow:hidden;
    max-width:480px;
    margin:0 auto;
  }
  .board-row{
    display:grid;
    grid-template-columns:96px 1fr 1fr;
    border-bottom:1px solid var(--line);
  }
  .board-row:last-child{border-bottom:none;}
  .board-row.head{
    background:var(--ink);
    color:var(--paper);
  }
  .board-row.head .cell{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.08em;
    padding:10px 12px;
    font-weight:700;
  }
  .board-row.head .cell.room-e{background:var(--teal); color:var(--paper);}
  .board-row.head .cell.room-d{background:var(--slate); color:var(--paper);}
  .time-cell{
    font-family:var(--mono);
    font-size:13px;
    padding:14px 8px;
    color:var(--ink-soft);
    border-right:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    white-space:nowrap;
  }
  .time-cell .t-main{color:var(--ink);font-weight:700;font-size:14px;}
  .slot-cell{
    padding:12px;
    border-right:1px solid var(--line);
    min-height:64px;
    display:flex;
    align-items:center;
    cursor:pointer;
    transition:background 0.12s;
  }
  .slot-cell:last-child{border-right:none;}
  .slot-cell.empty{justify-content:center;}
  .slot-cell.empty:hover{background:var(--teal-tint);}
  .slot-cell.empty .plus{
    font-family:var(--mono);
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    opacity:0.55;
    transition:opacity 0.12s, color 0.12s;
  }
  .slot-cell.empty:hover .plus{opacity:1; color:var(--teal);}
  .slot-cell.taken{
    background:var(--taken);
    cursor:default;
  }
  .booking-info{width:100%;}
  .booking-info .who{
    font-weight:700;
    font-size:14px;
    color:var(--ink);
  }
  .booking-info .purpose{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .cancel-btn{
    font-family:var(--mono);
    font-size:11px;
    color:var(--danger);
    background:none;
    border:none;
    cursor:pointer;
    padding:0;
    margin-top:6px;
    letter-spacing:0.04em;
    text-decoration:underline;
  }
  .edit-btn{
    color:var(--teal);
  }
  .noshow-btn{
    color:var(--ink-soft);
    opacity:0.75;
  }
  .noshow-btn:hover{opacity:1; color:var(--danger);}
  .imminent-badge{
    display:inline-block;
    font-family:var(--mono);
    font-size:10px;
    font-weight:700;
    color:var(--danger);
    background:var(--danger-tint);
    padding:1px 6px;
    border-radius:2px;
    letter-spacing:0.02em;
    vertical-align:middle;
  }

  .footnote{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-soft);
    margin-top:14px;
    line-height:1.6;
  }

  .notice-box{
    max-width:480px;
    margin:24px auto 0;
    border:1.5px solid var(--line);
    background:var(--panel);
    border-radius:var(--radius);
    padding:16px 18px;
  }
  .notice-box h3{
    margin:0 0 10px;
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.08em;
    color:var(--ink);
    text-transform:uppercase;
  }
  .notice-box ul{
    margin:0;
    padding-left:18px;
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.7;
  }
  .notice-box li{margin-bottom:4px;}
  .notice-box li:last-child{margin-bottom:0;}
  .notice-box strong{color:var(--ink);}

  .export-row{
    max-width:480px;
    margin:14px auto 0;
    text-align:center;
  }

  /* modal */
  .overlay{
    position:fixed;inset:0;
    background:rgba(34,48,63,0.45);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--panel);
    border:1.5px solid var(--ink);
    border-radius:var(--radius);
    padding:26px;
    width:100%;
    max-width:380px;
  }
  .modal h2{
    margin:0 0 4px;
    font-size:17px;
  }
  .modal .sub{
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:18px;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:12px;
    font-family:var(--mono);
    color:var(--ink-soft);
    margin-bottom:5px;
    letter-spacing:0.03em;
  }
  .field input, .field textarea{
    width:100%;
    padding:9px 10px;
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    font-family:var(--sans);
    font-size:14px;
    color:var(--ink);
    background:#fff;
  }
  .field input:focus, .field textarea:focus{
    outline:none;
    border-color:var(--teal);
  }
  .field textarea{resize:vertical;min-height:56px;}
  .modal-actions{
    display:flex;
    gap:8px;
    margin-top:18px;
  }
  .btn{
    flex:1;
    padding:10px 12px;
    border-radius:var(--radius);
    font-family:var(--sans);
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    border:1.5px solid var(--ink);
  }
  .btn.primary{
    background:var(--teal);
    color:#fff;
    border-color:var(--teal);
  }
  .btn.primary:disabled{
    opacity:0.4;
    cursor:not-allowed;
  }
  .btn.ghost{
    background:none;
    color:var(--ink);
  }
  .error-msg{
    font-size:12px;
    color:var(--danger);
    margin-top:-6px;
    margin-bottom:10px;
    display:none;
  }
  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:var(--paper);
    font-family:var(--mono);
    font-size:13px;
    padding:10px 18px;
    border-radius:var(--radius);
    opacity:0;
    transition:all 0.2s;
    pointer-events:none;
    z-index:60;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  @media (max-width:520px){
    .board-row{grid-template-columns:70px 1fr 1fr;}
    .time-cell{padding:10px 8px;font-size:12px;}
    .time-cell .t-main{font-size:13px;}
    .slot-cell{padding:8px;min-height:56px;}
    h1{font-size:21px;}
  }

  /* calendar */
  .calendar-wrap{
    border:1.5px solid var(--ink);
    background:var(--panel);
    border-radius:var(--radius);
    padding:12px 14px 10px;
    margin:0 auto 20px;
    max-width:480px;
  }
  .calendar-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
  }
  .calendar-title{
    font-family:var(--mono);
    font-weight:700;
    font-size:12px;
    letter-spacing:0.04em;
  }
  .calendar-grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:3px;
  }
  .cal-dow{
    font-family:var(--mono);
    font-size:10px;
    color:var(--ink-soft);
    text-align:center;
    padding-bottom:3px;
  }
  .cal-day{
    aspect-ratio:1;
    min-height:28px;
    border-radius:2px;
    border:1px solid var(--line);
    background:var(--paper);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:1px;
    cursor:pointer;
    font-family:var(--sans);
  }
  .cal-day:hover{border-color:var(--ink);}
  .cal-day.blank{
    visibility:hidden;
    cursor:default;
  }
  .cal-day .cal-num{
    font-size:11px;
    font-weight:600;
    color:var(--ink);
  }
  .cal-day .cal-dot{
    width:4px;
    height:4px;
    border-radius:50%;
    background:transparent;
  }
  .cal-day.has-empty .cal-dot{background:var(--line);}
  .cal-day.has-mid .cal-dot{background:var(--copper);}
  .cal-day.has-full .cal-dot{background:var(--danger);}
  .cal-day.selected{
    background:var(--teal);
    border-color:var(--teal);
  }
  .cal-day.selected .cal-num{color:#fff;}
  .cal-day.today .cal-num{text-decoration:underline;}
  .cal-day.beyond-horizon{
    opacity:0.4;
  }
  .cal-day.beyond-horizon .cal-num{color:var(--ink-soft);}
  .calendar-legend{
    display:flex;
    align-items:center;
    gap:5px;
    font-family:var(--mono);
    font-size:10px;
    color:var(--ink-soft);
    margin-top:10px;
    flex-wrap:wrap;
  }
  .calendar-legend .dot{
    width:6px;height:6px;border-radius:50%;display:inline-block;margin-left:7px;
  }
  .calendar-legend .dot:first-child{margin-left:0;}
  .dot-empty{background:var(--line);}
  .dot-mid{background:var(--copper);}
  .dot-full{background:var(--danger);}

  @media (max-width:520px){
    .calendar-wrap{max-width:100%;}
    .cal-day{min-height:26px;}
    .cal-day .cal-num{font-size:10px;}
  }
</style>
</head>
