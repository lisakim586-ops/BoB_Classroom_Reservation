<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BoB 15기 강의실 예약 — 관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EEF0F2;
    --panel: #F7F8FA;
    --ink: #1B2733;
    --ink-soft: #5C6A78;
    --line: #D6DBE1;
    --teal: #0069AD;
    --teal-tint: #E3F0F8;
    --slate: #46607D;
    --taken: #E3E7EC;
    --danger: #B23A2F;
    --danger-tint: #F6E4E1;
    --radius: 3px;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
    --sans: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    padding:32px 20px 80px;
  }
  .wrap{max-width:720px;margin:0 auto;}
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:2px solid var(--teal);
    padding-bottom:16px;
    margin-bottom:24px;
  }
  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.14em;
    color:var(--ink-soft);
    text-transform:uppercase;
    margin:0 0 6px;
  }
  h1{margin:0;font-size:22px;font-weight:700;}
  a.back-link{
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink-soft);
    text-decoration:none;
    border-bottom:1px dotted var(--ink-soft);
  }

  /* login gate */
  #loginGate{
    max-width:340px;
    margin:80px auto;
    text-align:center;
  }
  #loginGate p{color:var(--ink-soft); font-size:13px; margin-bottom:18px;}
  #loginGate input{
    width:100%;
    padding:10px 12px;
    border:1.5px solid var(--ink);
    border-radius:var(--radius);
    font-family:var(--mono);
    font-size:15px;
    text-align:center;
    margin-bottom:10px;
  }
  #loginGate button{
    width:100%;
    padding:10px;
    border-radius:var(--radius);
    background:var(--teal);
    color:#fff;
    border:none;
    font-family:var(--sans);
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
  #loginError{color:var(--danger); font-size:12px; margin-top:8px; display:none;}

  #adminBody{display:none;}

  section{
    border:1.5px solid var(--ink);
    background:var(--panel);
    border-radius:var(--radius);
    padding:18px 20px;
    margin-bottom:20px;
  }
  section h2{
    margin:0 0 12px;
    font-size:14px;
    font-family:var(--mono);
    letter-spacing:0.05em;
    text-transform:uppercase;
  }

  .blocked-form{
    display:flex;
    gap:8px;
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  .blocked-form input[type=date]{
    font-family:var(--mono);
    font-size:14px;
    padding:8px 10px;
    border:1.5px solid var(--ink);
    border-radius:var(--radius);
    background:#fff;
  }
  .blocked-form button{
    font-family:var(--sans);
    font-weight:600;
    font-size:13px;
    padding:8px 14px;
    border-radius:var(--radius);
    background:var(--teal);
    color:#fff;
    border:none;
    cursor:pointer;
  }
  .blocked-list{list-style:none; margin:0; padding:0;}
  .blocked-list li{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 10px;
    border-bottom:1px solid var(--line);
    font-family:var(--mono);
    font-size:13px;
  }
  .blocked-list li:last-child{border-bottom:none;}
  .blocked-list .remove-btn{
    font-family:var(--sans);
    font-size:12px;
    color:var(--danger);
    background:none;
    border:none;
    cursor:pointer;
    text-decoration:underline;
  }
  .empty-note{color:var(--ink-soft); font-size:13px; font-family:var(--mono);}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th, td{padding:7px 8px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap;}
  th{font-family:var(--mono); font-size:11px; color:var(--ink-soft); text-transform:uppercase;}
  .table-wrap{overflow-x:auto;}
  .del-btn{
    font-family:var(--sans);
    font-size:12px;
    color:var(--danger);
    background:none;
    border:none;
    cursor:pointer;
    text-decoration:underline;
  }

  .export-btn{
    font-family:var(--sans);
    font-weight:600;
    font-size:13px;
    padding:9px 16px;
    border-radius:var(--radius);
    background:var(--ink);
    color:#fff;
    border:none;
    cursor:pointer;
  }

  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:var(--paper);
    font-family:var(--mono);
    font-size:13px;
    padding:10px 18px;
    border-radius:var(--radius);
    opacity:0;
    transition:all 0.2s;
    pointer-events:none;
    z-index:60;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div id="loginGate">
  <p class="eyebrow">BoB 15기 강의실 예약 · 관리자</p>
  <p>운영진 비밀번호를 입력하세요.</p>
  <input type="password" id="passInput" placeholder="운영진 비밀번호">
  <button id="loginBtn">입장</button>
  <p id="loginError">비밀번호가 일치하지 않아요.</p>
</div>

<div class="wrap" id="adminBody">
  <header>
    <div>
      <p class="eyebrow">BoB 15기 강의실 예약</p>
      <h1>관리자 화면</h1>
    </div>
    <a class="back-link" href="/">← 예약판으로</a>
  </header>

  <section>
    <h2>예약 불가 날짜 관리</h2>
    <div class="blocked-form">
      <input type="date" id="blockDateInput">
      <button id="addBlockBtn">차단 추가</button>
    </div>
    <ul class="blocked-list" id="blockedList"></ul>
  </section>

  <section>
    <h2>전체 예약 현황</h2>
    <div class="table-wrap">
      <table id="resTable">
        <thead>
          <tr>
            <th>날짜</th><th>시간</th><th>강의실</th><th>팀명</th><th>사용자</th><th>PM 연락처</th><th></th>
          </tr>
        </thead>
        <tbody id="resTableBody"></tbody>
      </table>
    </div>
  </section>

  <section>
    <h2>내보내기</h2>
    <button class="export-btn" id="exportBtn">⬇ CSV로 내보내기</button>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
let adminPasscode = sessionStorage.getItem('bob-admin-pass') || '';
let slots = [];

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

async function adminFetch(url, body = {}){
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...body, adminPasscode })
  });
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(!res.ok){
    throw new Error((data && data.error) || `요청 실패 (${res.status})`);
  }
  return data;
}

async function login(){
  const pass = document.getElementById('passInput').value;
  document.getElementById('loginError').style.display = 'none';
  try{
    adminPasscode = pass;
    await adminFetch('/api/admin/login');
    sessionStorage.setItem('bob-admin-pass', pass);
    document.getElementById('loginGate').style.display = 'none';
    document.getElementById('adminBody').style.display = 'block';
    await loadAll();
  }catch(e){
    document.getElementById('loginError').style.display = 'block';
  }
}

async function loadAll(){
  await Promise.all([loadBlockedDates(), loadReservations()]);
}

async function loadBlockedDates(){
  try{
    const data = await adminFetch('/api/admin/reservations');
    slots = data.meta.slots;
    renderBlockedDates(data.meta.blockedDates || []);
  }catch(e){
    showToast(e.message);
  }
}

function renderBlockedDates(dates){
  const list = document.getElementById('blockedList');
  list.innerHTML = '';
  if(dates.length === 0){
    list.innerHTML = '<li class="empty-note">현재 차단된 날짜가 없어요.</li>';
    return;
  }
  dates.forEach(date => {
    const li = document.createElement('li');
    li.innerHTML = `<span>${date}</span><button class="remove-btn" data-date="${date}">해제</button>`;
    li.querySelector('.remove-btn').addEventListener('click', () => removeBlockedDate(date));
    list.appendChild(li);
  });
}

async function addBlockedDate(){
  const date = document.getElementById('blockDateInput').value;
  if(!date){ showToast('날짜를 선택해주세요.'); return; }
  try{
    await adminFetch('/api/admin/blocked-dates', { date, action: 'add' });
    showToast(`${date} 예약을 막았어요.`);
    document.getElementById('blockDateInput').value = '';
    await loadBlockedDates();
  }catch(e){
    showToast(e.message);
  }
}

async function removeBlockedDate(date){
  try{
    await adminFetch('/api/admin/blocked-dates', { date, action: 'remove' });
    showToast(`${date} 차단을 해제했어요.`);
    await loadBlockedDates();
  }catch(e){
    showToast(e.message);
  }
}

async function loadReservations(){
  try{
    const data = await adminFetch('/api/admin/reservations');
    slots = data.meta.slots;
    renderReservations(data.reservations);
  }catch(e){
    showToast(e.message);
  }
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderReservations(reservations){
  const tbody = document.getElementById('resTableBody');
  tbody.innerHTML = '';
  if(reservations.length === 0){
    tbody.innerHTML = '<tr><td colspan="7" class="empty-note">예약이 없어요.</td></tr>';
    return;
  }
  reservations.forEach(r => {
    const slot = slots[r.slotIndex] || {};
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${r.date}</td>
      <td>${slot.start || ''}-${slot.end || ''}</td>
      <td>${r.room}</td>
      <td>${escapeHtml(r.team || '')}</td>
      <td>${escapeHtml(r.name || '')}</td>
      <td>${escapeHtml(r.contact || '')}</td>
      <td><button class="del-btn" data-id="${r.id}">삭제</button></td>
    `;
    tr.querySelector('.del-btn').addEventListener('click', () => deleteReservation(r.id));
    tbody.appendChild(tr);
  });
}

async function deleteReservation(id){
  if(!confirm('이 예약을 삭제할까요? (취소·노쇼 이력은 남지 않아요)')) return;
  try{
    await fetch(`/api/admin/reservations/${id}/delete`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ adminPasscode })
    });
    showToast('삭제했어요.');
    await loadReservations();
  }catch(e){
    showToast('삭제에 실패했어요.');
  }
}

async function exportCSV(){
  try{
    const res = await fetch('/api/export.csv', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ adminPasscode })
    });
    if(!res.ok){
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || '내보내기 실패');
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `BoB15기_강의실예약현황_${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){
    showToast(e.message);
  }
}

document.getElementById('loginBtn').addEventListener('click', login);
document.getElementById('passInput').addEventListener('keydown', (e) => { if(e.key === 'Enter') login(); });
document.getElementById('addBlockBtn').addEventListener('click', addBlockedDate);
document.getElementById('exportBtn').addEventListener('click', exportCSV);

(async function init(){
  if(adminPasscode){
    try{
      await adminFetch('/api/admin/login');
      document.getElementById('loginGate').style.display = 'none';
      document.getElementById('adminBody').style.display = 'block';
      await loadAll();
    }catch(e){
      sessionStorage.removeItem('bob-admin-pass');
    }
  }
})();
</script>
</body>
</html>
